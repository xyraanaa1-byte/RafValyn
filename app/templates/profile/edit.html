{% extends 'base.html' %}
{% block title %}Edit Profil — RafValyn 🌹{% endblock %}

{% block extra_css %}
<style>
    .edit-wrapper {
        max-width: 700px;
        margin: 0 auto;
        padding: 2rem 3rem;
    }

    .page-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .back-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .back-btn:hover {
        border-color: var(--pink);
        color: var(--pink);
    }

    .page-header h1 {
        font-family: 'Playfair Display', serif;
        font-size: 1.6rem;
        color: var(--text);
    }

    /* Photo upload */
    .photo-upload-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2rem;
        text-align: center;
        margin-bottom: 1.5rem;
        backdrop-filter: blur(10px);
    }

    .photo-preview-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 1rem;
    }

    .photo-preview {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--pink);
        box-shadow: 0 0 30px rgba(255,45,120,0.3);
    }

    .photo-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .photo-preview-wrapper:hover .photo-overlay {
        opacity: 1;
    }

    .photo-overlay svg {
        color: white;
    }

    .photo-upload-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.5rem;
        background: rgba(255,45,120,0.1);
        border: 1px solid rgba(255,45,120,0.3);
        border-radius: 10px;
        color: var(--pink);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .photo-upload-label:hover {
        background: rgba(255,45,120,0.2);
    }

    .photo-hint {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
    }

    /* Form */
    .form-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2rem;
        backdrop-filter: blur(10px);
        margin-bottom: 1.5rem;
    }

    .form-card h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.1rem;
        color: var(--text);
        margin-bottom: 1.5rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .form-group {
        margin-bottom: 1.2rem;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    label {
        display: block;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255,45,120,0.5);
        display: flex;
        align-items: center;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
        width: 100%;
        padding: 0.85rem 1rem 0.85rem 2.8rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: 'Lato', sans-serif;
        transition: all 0.3s ease;
        outline: none;
    }

    textarea {
        padding: 0.85rem 1rem 0.85rem 2.8rem;
        min-height: 100px;
        resize: vertical;
    }

    input:focus, textarea:focus {
        border-color: var(--pink);
        background: rgba(255,255,255,0.07);
        box-shadow: 0 0 20px var(--pink-glow);
    }

    input::placeholder, textarea::placeholder {
        color: var(--text-muted);
    }

    input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .hint-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.3rem;
    }

    /* Tombol */
    .btn-save {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--pink-light), var(--pink));
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 1rem;
        font-family: 'Lato', sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px var(--pink-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px var(--pink-glow);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: var(--text-muted);
        font-size: 0.85rem;
        transition: color 0.3s;
    }

    .btn-cancel:hover { color: var(--pink); }

    @media (max-width: 600px) {
        .form-row { grid-template-columns: 1fr; }
        .edit-wrapper { padding: 1rem; }
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-wrapper">

    <div class="page-header">
        <a href="{{ url_for('profile.view') }}" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>Edit Profil</h1>
    </div>

    <form method="POST" action="{{ url_for('profile.edit') }}" enctype="multipart/form-data">

        <!-- Upload Foto -->
        <div class="photo-upload-section">
            <div class="photo-preview-wrapper">
                <img src="{{ url_for('static', filename='uploads/profiles/' + user.profile_photo) }}"
                     onerror="this.src='https://ui-avatars.com/api/?name={{ user.username }}&background=ff2d78&color=fff&size=200'"
                     alt="Foto Profil"
                     class="photo-preview"
                     id="photoPreview">
                <label for="photoInput" class="photo-overlay">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </label>
            </div>
            <label for="photoInput" class="photo-upload-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Ganti Foto
            </label>
            <input type="file" name="photo" id="photoInput" accept="image/*" style="display:none;" onchange="previewPhoto(this)">
            <p class="photo-hint">JPG, PNG, WebP. Maks 5MB</p>
        </div>

        <!-- Info Dasar -->
        <div class="form-card">
            <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Informasi Dasar
            </h3>

            <div class="form-row">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" name="username" value="{{ user.username }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" value="{{ user.email }}" disabled>
                    </div>
                    <p class="hint-text">Email tidak dapat diubah</p>
                </div>
            </div>

            <div class="form-group">
                <label>Bio</label>
                <div class="input-wrapper">
                    <span class="input-icon" style="top:1.2rem;transform:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                    </span>
                    <textarea name="bio" placeholder="Ceritakan sedikit tentang dirimu...">{{ user.bio or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- Kontak -->
        <div class="form-card">
            <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg>
                Kontak & Alamat
            </h3>

            <div class="form-group">
                <label>Nomor HP</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/></svg>
                    </span>
                    <input type="tel" name="phone" value="{{ user.phone or '' }}" placeholder="08xxxxxxxxxx">
                </div>
            </div>

            <div class="form-group">
                <label>Alamat Lengkap</label>
                <div class="input-wrapper">
                    <span class="input-icon" style="top:1.2rem;transform:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </span>
                    <textarea name="address" placeholder="Jl. Contoh No. 123, Kota, Provinsi">{{ user.address or '' }}</textarea>
                </div>
            </div>
        </div>

        <!-- Tombol Simpan -->
        <button type="submit" class="btn-save">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Simpan Perubahan
        </button>
        <a href="{{ url_for('profile.view') }}" class="btn-cancel">Batal</a>

    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photoPreview').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
